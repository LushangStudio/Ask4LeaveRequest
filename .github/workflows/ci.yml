name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-isolated-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-isolated-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_MODE: demo
      LEAVE_DATA_DIR: /tmp/ask4leave-ci
      PDF_FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Chinese PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei fonts-arphic-uming
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Build Vue frontend
        run: npm run build
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Test backend and built asset routes
        run: python -m pytest -q
      - name: Test MySQL transactions, permissions and job concurrency
        env:
          MYSQL_TEST_URL: mysql+pymysql://root:ci-isolated-password@127.0.0.1:3306/mysql
        run: python -m pytest -q tests/test_workflow.py tests/test_pdf_jobs.py tests/test_withdrawal.py tests/test_signatures_directory.py tests/test_security_boundaries.py
      - name: Ensure generated artifacts are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(dist|node_modules|var)/|(^|/)\.env$|\.(db|sqlite|sqlite3)$'; then
            echo 'Generated artifacts or runtime configuration must not be tracked.' >&2
            exit 1
          fi
