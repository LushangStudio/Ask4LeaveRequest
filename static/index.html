<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请假申请 · 路上工作室</title><link rel="stylesheet" href="static/style.css"></head><body>
<header><a href="/">路上工作室 <span> / 请假申请</span></a><span class="tag">本地演示</span></header>
<main><section class="hero"><div><small>ASK FOR LEAVE</small><h1>把请假，变简单。</h1><p>课程、活动与其他事项，一次填写，统一审批。</p></div><div class="identity"><label for="identity">当前演示身份</label><select id="identity"><option value="student-a">学生甲 · 管理学院</option><option value="counselor-a">辅导员甲</option><option value="student-b">学生乙 · 管理学院</option><option value="counselor-b">辅导员乙</option></select><button id="login">切换身份</button></div></section>
<div class="notice">演示环境仅使用虚构数据。尚未接入 ehall，生成文件不是正式请假凭证。</div>
<div id="message" role="status" aria-live="polite"></div>
<div class="workspace"><section id="apply" class="panel"><div class="section-title"><h2>新建请假申请</h2><span>01 — 填写信息</span></div><p id="profile" class="muted"></p><form id="form"><div class="two"><label>开始日期<input name="starts" type="date" required></label><label>结束日期<input name="ends" type="date" required></label></div><label>请假原因<textarea name="reason" placeholder="请简要说明请假原因" maxlength="4000" rows="3" required></textarea></label><div class="section-title"><h3>请假事项</h3><button type="button" class="light" id="add">＋ 添加事项</button></div><div id="items"></div><fieldset><legend>请假条生成方式</legend><label class="radio"><input type="radio" name="layout" value="combined" checked>合并生成 · 所有事项放在同一份请假条</label><label class="radio"><input type="radio" name="layout" value="separate">分别生成 · 每个事项一份请假条</label></fieldset><p class="muted">由系统分配给负责你的辅导员，审批通过后自动生成。</p><button id="submit" class="primary">提交申请</button></form></section>
<section class="panel"><div class="section-title"><h2 id="list-title">我的申请</h2><button class="light" id="refresh">刷新</button></div><div id="records" class="records"><p class="muted">请选择演示身份开始体验。</p></div></section></div></main><footer>路上工作室 · Lushang Studio</footer><script src="static/app.js" defer></script></body></html>
